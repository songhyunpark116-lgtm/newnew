<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PastPaper Coach</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1d2230;--mu:#6b7285;--pr:#4f46e5;--prt:#eef0ff;--ok:#16a34a;--okt:#e7f8ee;--bad:#dc2626;--badt:#fdecec;--bd:#e3e6ef;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#eceef5;--mu:#9aa1b5;--pr:#8b85ff;--prt:#262a45;--ok:#4ade80;--okt:#173326;--bad:#f87171;--badt:#3a1c1f;--bd:#2c3040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#eceef5;--mu:#9aa1b5;--pr:#8b85ff;--prt:#262a45;--ok:#4ade80;--okt:#173326;--bad:#f87171;--badt:#3a1c1f;--bd:#2c3040;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.note{background:var(--prt);color:var(--pr);font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:99px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tag{display:inline-block;font-size:11px;background:var(--prt);color:var(--pr);padding:2px 8px;border-radius:6px;margin-right:6px}
.src{font-size:12px;color:var(--mu)}
.q{font-size:16px;font-weight:600;margin:10px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;margin:7px 0;font-size:15px;cursor:pointer}
.opt.sel{border-color:var(--pr);background:var(--prt)}
.opt.ok{border-color:var(--ok);background:var(--okt)}.opt.no{border-color:var(--bad);background:var(--badt)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;width:100%;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.4;cursor:default}.btn.ghost{background:var(--prt);color:var(--pr)}
.fb{margin-top:10px;padding:11px 12px;border-radius:10px;font-size:14px}
.fb.ok{background:var(--okt)}.fb.no{background:var(--badt)}
.lock{font-size:12px;color:var(--mu);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px 9px;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}.stat small{color:var(--mu);font-size:12px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 PastPaper Coach</h1>
  <p class="sub">기출문제 연습 · 오답 은행 · 약점 분석</p>
  <div class="note">디자인 데모예요. 문제는 예시이고, 실제 기출 PDF가 모이면 교체됩니다.</div>

  <section id="v-practice">
    <div class="chips" id="subj"></div>
    <div class="chips" id="chap"></div>
    <div id="qbox"></div>
  </section>

  <section id="v-bank" class="hide"></section>
  <section id="v-prog" class="hide"></section>
</div>
<nav>
  <button data-v="practice" class="on"><span>✏️</span>연습</button>
  <button data-v="bank"><span>📕</span>오답 은행 <b id="cnt"></b></button>
  <button data-v="prog"><span>📊</span>진도</button>
</nav>

<script>
var Q=[
{id:1,s:"수학",c:"이차방정식",src:"2023 Paper 1 · Q3",q:"x² − 5x + 6 = 0 의 두 근의 합은?",o:["5","6","−5","1"],a:0,e:"근과 계수의 관계: 두 근의 합 = −b/a = 5"},
{id:2,s:"수학",c:"삼각함수",src:"2022 Paper 2 · Q7",q:"sin 30° 의 값은?",o:["√3/2","1/2","1","√2/2"],a:1,e:"특수각 sin 30° = 1/2"},
{id:3,s:"수학",c:"이차방정식",src:"2021 Paper 1 · Q5",q:"x² + 4x + 4 = 0 의 판별식 D는?",o:["16","8","0","−4"],a:2,e:"D = b² − 4ac = 16 − 16 = 0 (중근)"},
{id:4,s:"물리",c:"운동",src:"2023 Paper 1 · Q2",q:"가속도 2 m/s²로 5초 동안 등가속도 운동(정지 출발)한 속도는?",o:["5 m/s","10 m/s","20 m/s","2.5 m/s"],a:1,e:"v = at = 2 × 5 = 10 m/s"},
{id:5,s:"물리",c:"전기",src:"2022 Paper 1 · Q9",q:"저항 4Ω에 전압 12V를 걸면 전류는?",o:["48 A","8 A","3 A","0.3 A"],a:2,e:"옴의 법칙 I = V/R = 12/4 = 3 A"},
{id:6,s:"화학",c:"몰 계산",src:"2023 Paper 2 · Q4",q:"물(H₂O, Mr=18) 36 g은 몇 mol?",o:["1 mol","2 mol","0.5 mol","4 mol"],a:1,e:"n = m/Mr = 36/18 = 2 mol"}
];
var S={subj:"수학",chap:"전체",cur:null,sel:null,done:false,mode:"new",bank:{},log:[]};
var $=function(i){return document.getElementById(i)};
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function pool(){return Q.filter(function(q){return q.s===S.subj&&(S.chap==="전체"||q.c===S.chap)})}
function chips(el,items,cur,fn){el.innerHTML="";items.forEach(function(t){var b=document.createElement("button");b.className="chip"+(t===cur?" on":"");b.textContent=t;b.onclick=function(){fn(t)};el.appendChild(b)})}
function nextQ(){var p=pool();var left=p.filter(function(q){return !S.log.some(function(l){return l.id===q.id})&&!S.bank[q.id]});
 S.cur=left.length?left[0]:null;S.sel=null;S.done=false;S.mode="new";render()}
function renderChips(){
 chips($("subj"),uniq(Q.map(function(q){return q.s})),S.subj,function(t){S.subj=t;S.chap="전체";renderChips();nextQ()});
 var ch=["전체"].concat(uniq(Q.filter(function(q){return q.s===S.subj}).map(function(q){return q.c})));
 chips($("chap"),ch,S.chap,function(t){S.chap=t;renderChips();nextQ()})}
function card(q,retry){
 var h='<div class="card"><div class="row"><div><span class="tag">'+q.c+'</span><span class="src">'+q.src+'</span></div>'+(retry?'<span class="tag">재도전</span>':'')+'</div><div class="q">'+q.q+'</div>';
 q.o.forEach(function(t,i){var c="opt";if(S.done){if(i===q.a)c+=" ok";else if(i===S.sel)c+=" no"}else if(i===S.sel)c+=" sel";
  h+='<button class="'+c+'" '+(S.done?'disabled ':'')+'onclick="pick('+i+')">'+"ABCD"[i]+". "+t+'</button>'});
 if(!S.done){h+='<button class="btn" '+(S.sel===null?'disabled':'')+' onclick="submit()">제출하기</button><div class="lock">🔒 시도하기 전에는 정답과 해설이 공개되지 않아요.</div>'}
 else{var ok=S.sel===q.a;
  h+='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'정답! 🎉':'오답이에요')+'</b><br>'+q.e+'<br><small>'+(ok?(retry?'오답 은행에서 제거했어요.':''):'오답 은행에 단원 태그와 함께 저장했어요.')+'</small></div>';
  h+='<button class="btn" onclick="after()">'+(retry?'계속':'다음 문제')+'</button>'}
 return h+'</div>'}
function pick(i){if(S.done)return;S.sel=i;render()}
function submit(){var q=S.cur,ok=S.sel===q.a;S.done=true;
 if(S.mode==="new"){S.log.push({id:q.id,ok:ok});if(!ok)S.bank[q.id]=1}
 else{if(ok)delete S.bank[q.id]}
 render()}
function after(){if(S.mode==="retry"){S.view="bank";go("bank")}else nextQ()}
function render(){
 var b=$("qbox");
 if(S.cur)b.innerHTML=card(S.cur,S.mode==="retry");
 else b.innerHTML='<div class="card empty">이 범위의 문제를 모두 풀었어요 👏<br>다른 단원을 골라보세요.</div>';
 var n=Object.keys(S.bank).length;$("cnt").textContent=n?"("+n+")":"";
 bank();prog()}
function bank(){var ids=Object.keys(S.bank),h='<h1>오답 은행</h1><p class="sub">틀린 문제는 다시 맞혀야 목록에서 사라져요.</p>';
 if(!ids.length)h+='<div class="card empty">오답이 없어요. 깔끔해요! ✨</div>';
 ids.forEach(function(id){var q=Q.filter(function(x){return x.id==id})[0];
  h+='<div class="card"><span class="tag">'+q.s+" · "+q.c+'</span><div class="q">'+q.q+'</div><button class="btn ghost" onclick="retry('+q.id+')">다시 풀기</button></div>'});
 if(ids.length){var c={};ids.forEach(function(id){var q=Q.filter(function(x){return x.id==id})[0];c[q.c]=1});
  h+='<div class="card"><b>🤖 AI 복습 퀴즈 추천</b><div class="src" style="margin-top:4px">약한 단원: '+Object.keys(c).join(", ")+'</div></div>'}
 $("v-bank").innerHTML=h}
function retry(id){S.cur=Q.filter(function(x){return x.id===id})[0];S.sel=null;S.done=false;S.mode="retry";
 S.subj=S.cur.s;renderChips();go("practice");render()}
function prog(){var t=S.log.length,ok=S.log.filter(function(l){return l.ok}).length,n=Object.keys(S.bank).length;
 var h='<h1>진도 · 약점 분석</h1><p class="sub">단원별 정답률</p><div class="stat"><div><b>'+t+'</b><small>푼 문제</small></div><div><b>'+(t?Math.round(ok/t*100):0)+'%</b><small>정답률</small></div><div><b>'+n+'</b><small>오답 은행</small></div></div>';
 uniq(Q.map(function(q){return q.s+" · "+q.c})).forEach(function(k){
  var L=S.log.filter(function(l){var q=Q.filter(function(x){return x.id===l.id})[0];return q.s+" · "+q.c===k});
  var p=L.length?Math.round(L.filter(function(l){return l.ok}).length/L.length*100):0;
  h+='<div class="card"><div class="row"><span>'+k+'</span><b>'+(L.length?p+"%":"–")+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'});
 $("v-prog").innerHTML=h}
function go(v){["practice","bank","prog"].forEach(function(x){$("v-"+x).classList.toggle("hide",x!==v)});
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
renderChips();nextQ();
</script>
</body>
</html>
